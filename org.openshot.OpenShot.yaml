app-id: org.openshot.OpenShot
base: com.riverbankcomputing.PyQt.BaseApp
base-version: 5.15-25.08
runtime: org.kde.Platform
runtime-version: 5.15-25.08
sdk: org.kde.Sdk
command: openshot-qt
rename-icon: openshot-qt
rename-mime-icons:
  - openshot-qt-doc
finish-args:
  - --require-version=0.11.4 # fixes file saving
  - --share=ipc
  - --socket=x11
  - --device=dri
  - --share=network
  - --filesystem=host
  - --socket=pulseaudio
  - --talk-name=org.freedesktop.Flatpak
  - --env=QTWEBENGINEPROCESS_PATH=/app/bin/QtWebEngineProcess
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
cleanup:
  - /include
  - /lib/cmake
  - /lib/mkspecs
  - /lib/pkgconfig
  - /share/cmake
  - /share/man
  - /share/sip
  - '*.a'
  - '*.la'
cleanup-commands:
  - /app/cleanup-BaseApp.sh
modules:

  - python3-toml.json
  - python3-packaging.json

  - name: zeromq
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DCMAKE_BUILD_TYPE=Release
    cleanup:
      - /bin
    sources:
      - type: archive
        url: https://github.com/zeromq/libzmq/releases/download/v4.3.5/zeromq-4.3.5.tar.gz
        sha256: 6653ef5910f17954861fe72332e68b03ca6e4d9c7160eb3a8de5a5a913bfab43

  - name: swig
    config-opts:
      - --without-alllang
      - --with-python=/usr/bin/python3
      - --without-boost
      - --without-pcre
    cleanup:
      - '*'
    sources:
      - type: archive
        url: https://downloads.sourceforge.net/project/swig/swig/swig-4.0.2/swig-4.0.2.tar.gz
        sha256: d53be9730d8d58a16bf0cbd1f8ac0c0c3e1090573168bfa151b01eb47fa906fc

  - name: cppzmq
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DCMAKE_BUILD_TYPE=Release
      - -DCPPZMQ_BUILD_TESTS=OFF
    sources:
      - type: git
        url: https://github.com/zeromq/cppzmq.git
        commit: 76bf169fd67b8e99c1b0e6490029d9cd5ef97666
        tag: v4.7.1

  - name: pyzmq
    buildsystem: simple
    build-commands:
      - pip3 install --no-build-isolation --prefix=/app .
    sources:
      - type: git
        url: https://github.com/zeromq/pyzmq.git
        commit: 015e616fbc50023e7c5c77db2ddd7bee2919c6c1
        tag: v23.2.1

  - python3-requests.json

  - name: ImageMagick
    config-opts:
      - --disable-static
    cleanup:
      - /bin
      - /share/doc
    sources:
      - type: archive
        url: https://download.imagemagick.org/archive/releases/ImageMagick-7.1.1-29.tar.xz
        sha256: f140465fbeb0b4724cba4394bc6f6fb32715731c1c62572d586f4f1c8b9b0685

  - name: resvg
    buildsystem: simple
    build-commands:
      - cargo build --verbose --release --frozen --manifest-path capi/Cargo.toml --features
        "qt-backend"
      - install -Dm644 target/release/libresvg.so -t /app/lib
      - install -Dm644 capi/include/*.h -t /app/include/resvg
    sources:
      - type: archive
        url: https://github.com/RazrFalcon/resvg/releases/download/v0.9.1/resvg-0.9.1.tar.xz
        sha256: dd00841f0928c7106a6ee1ca761d7a61747d26a27038008a3568398136aa5b16
      - type: shell
        commands:
          - sed -i 's|/usr/local/share/fonts/|/run/host/fonts/|' usvg/src/fontdb.rs
      - type: patch
        paths:
          - patches/resvg-qt515.patch
          - patches/resvg-rust-191.patch

  - name: libopenshot-audio
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
    cleanup:
      - /bin
      - /share/doc
    sources:
      - type: archive
        url: https://github.com/OpenShot/libopenshot-audio/archive/v0.6.0.tar.gz
        sha256: f4df0429db6efc8441817da23d2536fbfb198c723309698cd2de4cb0533afc26

  - name: babl
    buildsystem: meson
    config-opts:
      - -Denable-gir=false
      - -Dwith-docs=false
    sources:
      - type: archive
        url: https://download.gimp.org/pub/babl/0.1/babl-0.1.96.tar.xz
        sha256: 33673fe459a983f411245a49f81fd7f1966af1ea8eca9b095a940c542b8545f6

  # Required by libopenshot when building with opencv.
  - name: protobuf
    buildsystem: autotools
    sources:
      - type: git
        url: https://github.com/protocolbuffers/protobuf/
        # This is the expected version.
        tag: v3.12.4
        commit: c9d2bd2fc781fe67ebf306807b9b6edb4a0d2764
    cleanup:
      - /bin

  - name: opencv
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
      - -DBUILD_TESTS=OFF
      - -DOPENCV_GENERATE_PKGCONFIG=ON
    cleanup:
      - /bin
    sources:
      - type: archive
        url: https://github.com/opencv/opencv/archive/5.0.0.tar.gz
        sha256: b0528f5a1d379d59d4701cb28c36e22214cc51cf64594e5b56f2d3e6c0233095
        x-checker-data:
          type: anitya
          project-id: 6615
          stable-only: true
          url-template: https://github.com/opencv/opencv/archive/$version.tar.gz
      - type: archive
        url: https://github.com/opencv/opencv_contrib/archive/5.0.0.tar.gz
        sha256: c58f6344170c39abf187c56f3843b59cab1fd3e89cf19ba2ce25dc061659b27f
        x-checker-data:
          type: anitya
          project-id: 6615
          stable-only: true
          url-template: https://github.com/opencv/opencv_contrib/archive/$version.tar.gz

  - name: libopenshot
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DENABLE_RUBY=0
    cleanup:
      - /share/doc
    sources:
      - type: archive
        url: https://github.com/OpenShot/libopenshot/archive/v0.7.0.tar.gz
        sha256: a7954c6af479fbd2e83059d4b6cbb13228de183f9a4eefcbcc8b3fd8de630dd2

  - name: openshot-qt
    buildsystem: simple
    build-commands:
      - python3 setup.py install --prefix=/app --root=/
      - install -D inkscape.sh /app/bin/inkscape
      - install -D blender.sh /app/bin/blender
    sources:
      - type: script
        dest-filename: inkscape.sh
        commands:
          - flatpak-spawn --host flatpak info org.inkscape.Inkscape >/dev/null 2>/dev/null
            && exec flatpak-spawn --host flatpak run org.inkscape.Inkscape "$@" ||
            exec flatpak-spawn --host flatpak run --command=zenity $FLATPAK_ID --error
            --text="Inkscape not installed!"
      - type: script
        dest-filename: blender.sh
        commands:
          - INPUT_FILE="$(awk -F "=" '/app-path/ {print $2}' /.flatpak-info)${2:4}"
            && exec flatpak-spawn --host flatpak run --filesystem=~/.local/share/flatpak
            --filesystem=/var/lib/flatpak org.blender.Blender -b ${INPUT_FILE} -P
            "$4"
      - type: archive
        url: https://github.com/OpenShot/openshot-qt/archive/v3.5.1.tar.gz
        sha256: 6e3bbca4ab81caf7941f6fc1edcaec2fe4b2989cce335eef095184566e1602d2
      - type: patch
        path: patches/openshot-appdata.patch
